name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: WEB

      - name: Typecheck
        run: npm run check
        working-directory: WEB

      - name: Tests
        run: npm test
        working-directory: WEB

      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
        working-directory: WEB
