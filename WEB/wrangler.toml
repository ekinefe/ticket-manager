name = "ticket-manager"
main = "worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# -----------------------------------------------------------------------------
# SINGLE-WORKER config (Cloudflare Git-integration model).
#
# One Worker (`ticket-manager`) serves BOTH:
#   - production  -> https://ticket-manager.gnrdigital.workers.dev
#                    (deploys from the `production` git branch)
#   - preview/branch -> automatic `*-ticket-manager...workers.dev` aliases
#                    (non-production branches, e.g. `dev`, via
#                     `wrangler versions upload` in the dashboard Builds config)
#
# Previously this used two separate Wrangler environments
# ([env.preview] + [env.production]) that created TWO Workers
# (`ticket-manager-pre` + `ticket-manager`). That split is removed; the
# `ticket-manager-pre` Worker will be deleted after the consolidated worker is
# verified. The `ticket-manager-preview` D1 stays as a backup only.
# -----------------------------------------------------------------------------

# Static assets: serve the current vanilla-JS client from WEB/client.
# Hono owns every /api/* route; Cloudflare serves client files directly.
# ASSETS binding + single-page-application: the Worker delegates non-API GETs to
# env.ASSETS, which serves the real file or falls back to client/index.html for
# client-side routes (/setup, /login, board deep-links, refresh).
[assets]
directory = "./client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
APP_URL = "https://ticket-manager.gnrdigital.workers.dev"
MAIL_FROM = "Ticket Manager <no-reply@ticket-manager.gnrdigital.workers.dev>"

# Primary database (production). `ticket-manager-preview` is retained as a
# backup database only and is intentionally not bound here.
[[d1_databases]]
binding = "DB"
database_name = "ticket-manager-prod"
database_id = "e0d6576a-7c8d-47f2-a8cb-ccf81d3017fb"

# R2 attachments are DISABLED for v1 (no metered/billed storage). The Worker
# falls back to a "disabled storage" that returns HTTP 503 on upload until a
# bucket is provisioned. Uncomment below when enabling attachments:
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "ticket-manager-uploads-prod"

# Scheduled (cron) jobs. Preview/branch versions (wrangler versions upload) do
# not add cron triggers, so these run only on the active production deployment.
# The Workers FREE plan caps total cron triggers at 5 per ACCOUNT.
#   daily   -> runDailyDigest  (daily 00:00)
#   weekly  -> runWeeklyReport (Sunday 22:00)
#   security-> runSecurityScan (Sunday 21:00)
# NOTE: Cloudflare cron follows Quartz where day-of-week 1 = Sunday (0 invalid).
[triggers]
crons = [
  "0 0 * * *",    # daily digest
  "0 22 * * 1",   # weekly report (Sun)
  "0 21 * * 1",   # security scan (Sun)
]
