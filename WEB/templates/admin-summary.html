<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ticket Manager {{period_label}} Summary</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:8px;overflow:hidden;
                    font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr>
          <td style="background:#0090a8;padding:20px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="width:30px;height:30px;background:#ffffff;border-radius:7px;text-align:center;">
                  <span style="color:#0090a8;font-size:13px;font-weight:800;line-height:30px;">TM</span>
                </td>
                <td style="padding-left:10px;">
                  <span style="color:#ffffff;font-size:18px;font-weight:700;">Ticket Manager</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <h1 style="margin:0 0 6px;font-size:19px;color:#242424;">
              {{period_label}} summary
            </h1>
            <p style="margin:0 0 20px;font-size:13px;color:#8a8a8a;">
              {{range_label}} &middot; sent to Super Admins only
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              {{stats_rows}}
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;">
              <tr>
                <td style="background:#0090a8;border-radius:6px;" align="center">
                  <a href="{{app_url}}"
                     style="display:inline-block;padding:12px 28px;
                            color:#ffffff;text-decoration:none;
                            font-size:14px;font-weight:bold;">
                    Open dashboard
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#fafafa;border-top:1px solid #ececec;
                     padding:16px 32px;font-size:11px;color:#9a9a9a;">
            Ticket Manager - self-hosted task management.<br>
            You receive this e-mail because you are a Super Admin.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
