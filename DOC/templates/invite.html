<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ticket Manager Invite</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:8px;overflow:hidden;
                    font-family:Arial,Helvetica,sans-serif;">
        <tr>
          <td style="background:#964826;padding:24px 32px;">
            <span style="color:#ffffff;font-size:20px;font-weight:bold;">Ticket&nbsp;Manager</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <h1 style="margin:0 0 16px;font-size:20px;color:#242424;">
              Join {{project}}
            </h1>
            <p style="margin:0 0 20px;font-size:14px;line-height:22px;color:#4b4b4b;">
              Hello {{name}},
              you have been invited to the <strong>{{project}}</strong>
              project as <strong>{{role}}</strong>.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background:#964826;border-radius:6px;" align="center">
                  <a href="{{invite_url}}"
                     style="display:inline-block;padding:12px 28px;
                            color:#ffffff;text-decoration:none;
                            font-size:14px;font-weight:bold;">
                    Accept invitation
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:12px;color:#8a8a8a;">
              This single-use link is valid for 48 hours.
            </p>
          </td>
        </tr>
        <tr>
          <td style="background:#fafafa;border-top:1px solid #ececec;
                     padding:16px 32px;font-size:11px;color:#9a9a9a;">
            Ticket Manager - self-hosted task management.<br>
            If you were not expecting this invitation, you can safely ignore it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
